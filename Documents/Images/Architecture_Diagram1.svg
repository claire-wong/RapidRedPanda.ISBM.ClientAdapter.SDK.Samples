<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">ISBM Client Adapter Architecture</title>
  <desc id="desc">Layered architecture diagram showing current sample applications, the RapidRedPanda ISBM ClientAdapter package, included package target frameworks, and current sample platforms.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M2,2 L10,6 L2,10 Z" fill="#285EA8"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #244c7d; stroke-width: 2.5; rx: 8; }
      .subpanel { fill: #eef5ff; stroke: #4779bd; stroke-width: 1.8; rx: 6; }
      .accent { fill: #dff3ea; stroke: #2f765a; stroke-width: 1.8; rx: 6; }
      .note { fill: #f3f6f9; stroke: #64748b; stroke-width: 1.5; rx: 6; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 30px; font-weight: 700; fill: #16324f; }
      .layer { font-family: Arial, Helvetica, sans-serif; font-size: 22px; font-weight: 700; fill: #16324f; }
      .heading { font-family: Arial, Helvetica, sans-serif; font-size: 19px; font-weight: 700; fill: #16324f; }
      .body { font-family: Arial, Helvetica, sans-serif; font-size: 17px; fill: #243447; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 15px; fill: #3d5068; }
      .arrow { stroke: #285EA8; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="900"/>
  <text class="title" x="700" y="54" text-anchor="middle">ISBM Client Adapter Architecture</text>
  <text class="small" x="700" y="82" text-anchor="middle">Current SDK samples using RapidRedPanda.ISBM.ClientAdapter 2.2.0</text>

  <rect class="panel" x="80" y="115" width="1240" height="155"/>
  <text class="layer" x="110" y="154">1. Applications / Samples</text>
  <rect class="subpanel" x="130" y="178" width="340" height="64"/>
  <text class="heading" x="300" y="205" text-anchor="middle">Windows WinForms Samples</text>
  <text class="small" x="300" y="229" text-anchor="middle">Channel, publication, and request workflows</text>
  <rect class="subpanel" x="530" y="178" width="340" height="64"/>
  <text class="heading" x="700" y="205" text-anchor="middle">Raspberry Pi OS Console Samples</text>
  <text class="small" x="700" y="229" text-anchor="middle">Publication provider and request provider</text>
  <rect class="subpanel" x="930" y="178" width="340" height="64"/>
  <text class="heading" x="1100" y="205" text-anchor="middle">Other .NET Applications</text>
  <text class="small" x="1100" y="229" text-anchor="middle">Consume the public NuGet package API</text>

  <path class="arrow" d="M700 285 L700 335"/>

  <rect class="panel" x="250" y="340" width="900" height="145"/>
  <text class="layer" x="700" y="378" text-anchor="middle">2. RapidRedPanda.ISBM.ClientAdapter 2.2.0</text>
  <rect class="accent" x="315" y="405" width="360" height="48"/>
  <text class="heading" x="495" y="436" text-anchor="middle">ISBM Interface Layer</text>
  <rect class="accent" x="725" y="405" width="360" height="48"/>
  <text class="heading" x="905" y="436" text-anchor="middle">HTTP Communication Layer</text>
  <text class="small" x="700" y="468" text-anchor="middle">One package reference used by current public samples</text>

  <path class="arrow" d="M700 500 L700 550"/>

  <rect class="panel" x="160" y="555" width="1080" height="130"/>
  <text class="layer" x="700" y="593" text-anchor="middle">3. Supported .NET Targets</text>
  <text class="body" x="700" y="630" text-anchor="middle">Included package TFMs: netstandard2.0 | netcoreapp3.1 | net6.0 | net8.0</text>
  <text class="small" x="700" y="660" text-anchor="middle">Sample project TFMs are shown separately below; they are not the same thing as package target frameworks.</text>

  <path class="arrow" d="M700 700 L700 738"/>

  <rect class="panel" x="90" y="765" width="585" height="105"/>
  <text class="layer" x="382" y="798" text-anchor="middle">4. Windows Samples</text>
  <text class="body" x="382" y="828" text-anchor="middle">CSharp/Windows/</text>
  <text class="small" x="382" y="853" text-anchor="middle">WinForms projects targeting .NET Framework 4.7.2</text>

  <rect class="panel" x="725" y="765" width="585" height="105"/>
  <text class="layer" x="1018" y="798" text-anchor="middle">4. Raspberry Pi Samples</text>
  <text class="body" x="1018" y="828" text-anchor="middle">CSharp/Raspberry-Pi-OS/</text>
  <text class="small" x="1018" y="853" text-anchor="middle">Console projects targeting .NET 8; current publish target: linux-arm</text>

  <rect class="note" x="385" y="708" width="630" height="34"/>
  <text class="small" x="700" y="730" text-anchor="middle">Platform boxes describe current samples, not universal ClientAdapter limits.</text>
</svg>
